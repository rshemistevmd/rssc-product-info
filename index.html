<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>RSSC PRODUCT INFO</title>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,query,where}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAd1COiqENQOmttc-9uOqeefurmByRzXmg",authDomain:"rssc-product-info.firebaseapp.com",projectId:"rssc-product-info",storageBucket:"rssc-product-info.firebasestorage.app",messagingSenderId:"355512054973",appId:"1:355512054973:web:4a7598a62ad8771b4bf3d4"};
const app=initializeApp(cfg);
window._db=getFirestore(app);
window._fbFns={collection,getDocs,addDoc,updateDoc,deleteDoc,doc,query,where};
window.dispatchEvent(new Event('firebase-ready'));
</script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f2f0eb;--bg2:#fff;--bg3:#e8e6e1;--border:#d0cdc7;
  --accent:#cc0000;--text:#111;--text2:#555550;--text3:#999990;
  --bar-bg:#111;--bar-text:#f2f0eb;--hi:rgba(204,0,0,.06);
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;-webkit-font-smoothing:antialiased;}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg);border-bottom:1.5px solid var(--text);display:flex;align-items:center;padding:0 20px;z-index:100;}
.logo{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--text);flex:1;text-transform:uppercase;}
.logo b{color:var(--accent);}
.navl{display:flex;}
.nb{background:none;border:none;border-left:1px solid var(--border);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;padding:0 13px;height:52px;text-transform:uppercase;transition:color .12s,background .12s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.nb:hover{color:var(--accent);background:rgba(204,0,0,.04);}
.nb.on{color:var(--accent);border-bottom:2.5px solid var(--accent);}
#mbt{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px;margin-left:8px;}
#mbt span{display:block;width:22px;height:2px;background:var(--text);}
#mmenu{display:none;position:fixed;top:52px;left:0;right:0;background:var(--bg);border-bottom:1.5px solid var(--text);z-index:99;}
#mmenu.open{display:block;}
.mni{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);cursor:pointer;font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:color .12s;}
.mni:hover{color:var(--accent);}
.mni-n{font-size:11px;color:var(--text3);font-weight:400;min-width:20px;}

/* SEARCH BAR */
#sbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bar-bg);border-top:1.5px solid var(--text);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:100;}
.slbl{font-size:10px;font-weight:700;letter-spacing:.15em;color:#555;text-transform:uppercase;white-space:nowrap;}
#sinput{flex:1;background:transparent;border:none;border-bottom:1px solid #444;color:var(--bar-text);font-family:var(--font);font-size:15px;font-weight:300;padding:6px 0;outline:none;min-width:0;}
#sinput:focus{border-bottom-color:var(--accent);}
#sinput::placeholder{color:#555;}
.sbtn{background:var(--accent);color:#fff;border:none;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.1em;padding:9px 16px;cursor:pointer;text-transform:uppercase;flex-shrink:0;}

/* MAIN */
#main{padding-top:52px;min-height:calc(100vh - 60px);}

/* HOME */
.home-hero{padding:48px 20px 32px;border-bottom:1px solid var(--border);}
.home-hero h1{font-size:clamp(36px,10vw,80px);font-weight:700;letter-spacing:-.01em;line-height:.95;text-transform:uppercase;}
.home-hero h1 em{font-style:italic;font-weight:300;color:var(--text2);}
.home-sub{margin-top:14px;font-size:12px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
.hmitem{display:flex;align-items:center;padding:0 20px;height:78px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;gap:16px;}
.hmitem:hover{background:var(--bg2);}
.hmitem:hover .hma{color:var(--accent);transform:translateX(4px);}
.hmn{font-size:11px;color:var(--text3);min-width:24px;}
.hmi{font-size:20px;}
.hml{flex:1;font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.hma{font-size:16px;color:var(--text3);transition:all .2s;}

/* PAGE HEADER */
.ph{padding:22px 20px 18px;border-bottom:1.5px solid var(--text);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ptag{font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;margin-bottom:4px;}
.ptitle{font-size:clamp(20px,5vw,32px);font-weight:700;letter-spacing:-.01em;text-transform:uppercase;line-height:1;}
.bc{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;letter-spacing:.04em;text-transform:uppercase;margin-top:5px;}
.bc .cr{cursor:pointer;transition:color .12s;}
.bc .cr:hover{color:var(--accent);}
.ph-r{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}

/* SORT INDICATOR */
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--accent);}
th.sort-asc::after{content:" ↑";}
th.sort-desc::after{content:" ↓";}

/* BUTTONS */
.btn{background:transparent;border:1.5px solid var(--border);color:var(--text2);font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.07em;padding:7px 13px;cursor:pointer;text-transform:uppercase;transition:all .12s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn:hover{border-color:var(--text);color:var(--text);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{opacity:.85;}
.btn.dng{color:var(--accent);border-color:rgba(204,0,0,.3);}
.btn.dng:hover{border-color:var(--accent);background:rgba(204,0,0,.05);}

/* SEASON LIST */
.sni{display:flex;align-items:center;padding:0 20px;height:66px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;gap:16px;}
.sni:hover{background:var(--bg2);}
.sni:hover .sniar{color:var(--accent);transform:translateX(3px);}
.sninum{font-size:11px;color:var(--text3);min-width:24px;}
.sninm{flex:1;font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.snict{font-size:11px;color:var(--text3);}
.sniar{color:var(--text3);font-size:15px;transition:all .2s;}
.sni-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:6px;border-radius:4px;line-height:1;transition:color .12s,background .12s;}
.sni-del:hover{color:var(--accent);background:rgba(204,0,0,.08);}

/* PRODUCT GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr;}
.pcard{border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;overflow:hidden;position:relative;}
.pcard:nth-child(even){border-right:none;}
.pcard:hover{background:var(--bg2);}
.pc-cb{position:absolute;top:8px;left:8px;width:17px;height:17px;cursor:pointer;accent-color:var(--accent);z-index:2;}
.pthumb{width:100%;aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pthumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.pcard:hover .pthumb img{transform:scale(1.03);}
.noimg{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
.pbar{padding:11px 13px;border-top:1px solid var(--border);}
.pnm{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.2;}
.pals{font-size:11px;color:var(--text3);margin-top:3px;}
.pcard.sel-card{outline:2.5px solid var(--accent);}

/* TABLE */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px;}
thead th{background:var(--bg);color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:11px 14px;text-align:left;border-bottom:1.5px solid var(--text);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
tbody tr:hover{background:var(--bg2);}
tbody tr.hl{background:var(--hi);border-left:3px solid var(--accent);}
tbody tr.ck{background:rgba(204,0,0,.05);}
tbody td{padding:12px 14px;color:var(--text);vertical-align:top;line-height:1.5;}
tbody td a{color:var(--accent);text-decoration:none;font-weight:600;}
tbody td a:hover{text-decoration:underline;}
.cb-col{width:36px;padding:0 10px !important;vertical-align:middle !important;text-align:center;}
.cb-col input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
.cat-cell{background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-align:center;vertical-align:middle;border-right:2px solid var(--accent);white-space:nowrap;padding:12px 12px;min-width:68px;}

/* SELECTION BAR */
.selbar{display:none;align-items:center;gap:12px;padding:9px 20px;background:#fff8f8;border-bottom:1px solid rgba(204,0,0,.2);font-size:12px;font-weight:700;letter-spacing:.06em;}
.selbar.on{display:flex;}
.selcnt{color:var(--accent);}

/* UPLOAD */
.upsec{padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:none;}
.upsec.open{display:block;}
.upsec h4{font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;}
.uprow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.uprow input[type=file]{background:var(--bg);border:1.5px dashed var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:7px 10px;cursor:pointer;flex:1;min-width:0;}
.upnote{font-size:11px;color:var(--text3);margin-top:7px;line-height:1.6;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:600px){.overlay{align-items:center;padding:24px;}}
.modal{background:var(--bg2);border:1.5px solid var(--text);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:su .2s ease;}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mhd{padding:16px 20px;border-bottom:1.5px solid var(--text);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1;}
.mhd h3{font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.mcls{background:none;border:1px solid var(--border);color:var(--text2);font-size:11px;cursor:pointer;padding:5px 10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.mcls:hover{border-color:var(--text);color:var(--text);}
.mbdy{padding:18px 20px;}
.mthumb{width:100%;aspect-ratio:4/3;background:var(--bg3);border:1px solid var(--border);margin-bottom:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mthumb img{width:100%;height:100%;object-fit:cover;}
.mthumb .noi{font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
.dr{display:flex;padding:11px 0;border-bottom:1px solid var(--border);gap:14px;}
.dr:last-of-type{border-bottom:none;}
.dlb{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;min-width:76px;padding-top:1px;flex-shrink:0;}
.dvl{font-size:13px;flex:1;line-height:1.5;word-break:break-all;}
.dvl a{color:var(--accent);text-decoration:none;}
.dvl a:hover{text-decoration:underline;}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.fg{margin-bottom:13px;}
.fg label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:5px;}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg);border:none;border-bottom:1.5px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;padding:8px 0;outline:none;transition:border-color .15s;resize:vertical;border-radius:0;}
.fg input:focus,.fg textarea:focus{border-bottom-color:var(--accent);}
.iuz{width:100%;aspect-ratio:16/9;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:8px;color:var(--text3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--bg);margin-bottom:14px;transition:border-color .15s;}
.iuz:hover{border-color:var(--accent);}
.iprv{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:pointer;margin-bottom:14px;border:1px solid var(--border);}
/* PW mask toggle */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:36px;}
.pw-eye{position:absolute;right:0;bottom:8px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0 4px;line-height:1;}
.pw-eye:hover{color:var(--text);}

/* SEARCH POPUP */
.spop{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:min(96vw,500px);background:var(--bg2);border:1.5px solid var(--text);z-index:150;box-shadow:0 -4px 24px rgba(0,0,0,.15);max-height:60vh;overflow-y:auto;}
.sphd{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;position:sticky;top:0;background:var(--bg2);}
.sphd button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;}
.sri{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.sri:last-child{border-bottom:none;}
.sri:hover{background:var(--bg3);}
.srt{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:2px;}
.srn{font-size:15px;font-weight:700;}
.srs{font-size:11px;color:var(--text3);margin-top:2px;}
.srhi{background:rgba(204,0,0,.12);border-radius:2px;padding:0 2px;}

/* TOAST */
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;padding:9px 22px;z-index:300;white-space:nowrap;animation:ti .2s ease;}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-6px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.loading,.estate{padding:56px 20px;text-align:center;font-size:12px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* LOGIN */
.login-wrap{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:340px;}
.login-box h2{font-size:30px;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:28px;}
.login-err{color:var(--accent);font-size:11px;letter-spacing:.06em;margin-bottom:12px;display:none;}
.pw-chg-lnk{font-size:11px;color:var(--text3);letter-spacing:.06em;text-decoration:underline;cursor:pointer;margin-top:10px;display:inline-block;}
.pw-chg-lnk:hover{color:var(--accent);}

@media(max-width:600px){
  .navl{display:none;}
  #mbt{display:flex;}
  .ph{padding:16px 16px 12px;}
  .home-hero{padding:28px 16px 22px;}
  .hmitem{height:64px;}
  .hml{font-size:20px;}
  .sni{height:58px;}
  .sninm{font-size:16px;}
  tbody td{padding:10px 11px;}
  thead th{padding:9px 11px;}
}
</style>
</head>
<body>
<nav id="nav">
  <div class="logo">RSSC <b>—</b> Product Info</div>
  <div class="navl">
    <button class="nb" id="nH" onclick="go('home')">홈</button>
    <button class="nb" id="nB" onclick="go('buja')">⛓️ 부자재</button>
    <button class="nb" id="nP" onclick="go('prod')">🏭 생산</button>
    <button class="nb" id="nK" onclick="go('pkg')">📦 패키지</button>
    <button class="nb" id="nI" onclick="go('idpw')">🔑 ID/PW</button>
  </div>
  <button id="mbt" onclick="toggleMenu()" aria-label="메뉴"><span></span><span></span><span></span></button>
</nav>
<div id="mmenu">
  <div class="mni" onclick="go('home');closeMenu()"><span class="mni-n">00</span>홈</div>
  <div class="mni" onclick="go('buja');closeMenu()"><span class="mni-n">01</span>⛓️ 부자재</div>
  <div class="mni" onclick="go('prod');closeMenu()"><span class="mni-n">02</span>🏭 생산</div>
  <div class="mni" onclick="go('pkg');closeMenu()"><span class="mni-n">03</span>📦 패키지</div>
  <div class="mni" onclick="go('idpw');closeMenu()"><span class="mni-n">04</span>🔑 ID/PW</div>
</div>
<div id="main"><div class="loading"><div class="spin"></div>로딩 중...</div></div>
<div id="sbar">
  <span class="slbl">Search</span>
  <input type="text" id="sinput" placeholder="제품명, 거래처명, 연락처..." onkeydown="if(event.key==='Enter')doSearch()"/>
  <button class="sbtn" onclick="doSearch()">검색</button>
</div>
<div id="spop" class="spop" style="display:none"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
'use strict';
// ── STATE ──
var db,fbFns;
var pg='home', season=null;
var allBuja=[],allProd=[],allPkg=[],allIdpw=[];
var _hlId=null,hlCol=null;
var editProdId=null,uploadedImg=null;
var editRowId=null;
var idpwUnlocked=false, IDPW_PASS='101700';
var selectedPid=null, checkedPids={}, checkedRows={};
var sortState={col:null,dir:1};
var CLD={cloud:'dgeaj6y5g',preset:'rssc_unsigned'};

// ── FIREBASE ──
window.addEventListener('firebase-ready',function(){
  db=window._db; fbFns=window._fbFns;
  Promise.all([load('buja',allBuja),load('production',allProd),load('package',allPkg),load('idpw',allIdpw)])
    .then(function(){go('home');})
    .catch(function(err){
      var msg=err.message||'';
      document.getElementById('main').innerHTML='<div class="estate" style="color:var(--accent)">⚠ 데이터 로드 실패'
        +(msg.indexOf('permission')>=0?'<br><span style="font-size:11px;color:var(--text3)">Firebase 보안 규칙을 확인해주세요</span>':'')
        +'<br><br><button class="btn pri" onclick="location.reload()">새로고침</button></div>';
    });
});
function load(col,arr){
  return fbFns.getDocs(fbFns.collection(db,col)).then(function(s){
    arr.length=0;
    s.docs.forEach(function(d){arr.push(Object.assign({id:d.id},d.data()));});
  }).catch(function(err){
    var msg=err.message||'';
    if(msg.indexOf('permission')>=0||msg.indexOf('PERMISSION')>=0)
      throw new Error('Firebase 보안 규칙 만료. 콘솔에서 규칙을 연장해주세요.');
    throw err;
  });
}
function addIt(col,data){
  data.updatedAt=Date.now();
  return fbFns.addDoc(fbFns.collection(db,col),data).then(function(r){return r.id;});
}
function updIt(col,id,data){
  data.updatedAt=Date.now();
  return fbFns.updateDoc(fbFns.doc(db,col,id),data);
}
function delIt(col,id){return fbFns.deleteDoc(fbFns.doc(db,col,id));}

// ── NAV ──
function go(p,s){
  pg=p; if(s!==undefined)season=s;
  ['nH','nB','nP','nK','nI'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.remove('on');});
  var m={home:'nH',buja:'nB','buja-season':'nB',prod:'nP',pkg:'nK',idpw:'nI'};
  if(m[p]){var el=document.getElementById(m[p]);if(el)el.classList.add('on');}
  sortState={col:null,dir:1};
  closeSpop();render();
}
function toggleMenu(){document.getElementById('mmenu').classList.toggle('open');}
function closeMenu(){document.getElementById('mmenu').classList.remove('open');}

// ── RENDER ──
function render(){
  var m=document.getElementById('main');
  if(pg==='home') m.innerHTML=renderHome();

  else if(pg==='idpw') m.innerHTML=renderIdpw();
}

// ── BUJA SEASONS ──
function getSeasons(){
  var s={};
  allBuja.forEach(function(i){
    var k=i.season||'미분류';
    if(!s[k])s[k]=0;
    if(!i._placeholder&&i.name)s[k]++;
  });
  return s;
}
function renderBujaSeasons(){
  var seasons=getSeasons(),keys=Object.keys(seasons);
  var items=keys.map(function(s,i){
    var num=i<9?'0'+(i+1):''+(i+1);
    return '<div class="sni">'
      +'<span class="sninum">'+num+'</span>'
      +'<span class="sninm" onclick="go(\'buja-season\',\''+escH(s)+'\')">'+escH(s)+'</span>'
      +'<span class="snict">'+seasons[s]+'개</span>'
      +'<span class="sniar" onclick="go(\'buja-season\',\''+escH(s)+'\')">→</span>'
      +'<button class="sni-del" onclick="deleteSeason(\''+escH(s)+'\')" title="시즌 삭제">✕</button>'
    +'</div>';
  }).join('');
  if(!items) items='<div class="estate">등록된 시즌이 없습니다</div>';
  return '<div class="ph"><div class="ph-l"><div class="ptag">부자재</div><div class="ptitle">⛓️ 시즌 목록</div></div>'
    +'<div class="ph-r"><button class="btn pri" onclick="openAddSeason()">+ 시즌 추가</button>'
    +'<button class="btn" onclick="toggleUp(\'buja\')">⬆ 엑셀</button></div></div>'
    +upSec('buja','시트명 = 시즌명 | 컬럼: 제품명 / 별칭 / 판매처 / 판매처정보 / 가격 / 주문단위 / 비고')

// ── SEASON DELETE ──
function deleteSeason(s){
  if(!confirm('['+s+'] 시즌 전체와 포함된 제품을 모두 삭제하시겠습니까?'))return;
  var targets=allBuja.filter(function(i){return (i.season||'미분류')===s;});
  Promise.all(targets.map(function(i){return delIt('buja',i.id);}))
    .then(function(){
      targets.forEach(function(i){allBuja=allBuja.filter(function(x){return x.id!==i.id;});});
      render();toast(s+' 시즌 삭제됨');
    }).catch(function(e){toast('삭제 실패: '+(e.message||e));});
}

// ── TABLE (생산/패키지) ──
function renderTable(colName){
  var isProd=colName==='production';
  var data=isProd?allProd:allPkg;
  var label=isProd?'🏭 생산':'📦 패키지';
  var tag=isProd?'생산':'패키지';
  var cols=isProd?['종류','거래처명','연락처','주소','사용제품','비고']:['거래처명','연락처','주소','사용제품','비고'];
  var flds=isProd?['name','contact','address','products','note']:['name','contact','address','products','note'];

  // sort
  var sorted=data.slice();
  if(sortState.col!==null){
    var sc=sortState.col; var sd=sortState.dir;
    sorted.sort(function(a,b){
      var av=String(a[cols[sc]]||a[flds[sc-1]]||'').toLowerCase();
      var bv=String(b[cols[sc]]||b[flds[sc-1]]||'').toLowerCase();
      return av<bv?-sd:av>bv?sd:0;
    });
  }

  var ths='<th class="cb-col"><input type="checkbox" id="ckAll-'+colName+'" onchange="togAllRows(this,\''+colName+'\')" title="전체선택"/></th>';
  cols.forEach(function(c,i){
    var sc=sortState.col===i+1;
    var cls='sortable'+(sc?(sortState.dir===1?' sort-asc':' sort-desc'):'');
    ths+='<th class="'+cls+'" onclick="sortTable(\''+colName+'\','+( i+1)+')">'+c+'</th>';
  });

  var trs='';
  if(sorted.length){
    if(isProd){
      var groups={},gorder=[];
      sorted.forEach(function(r){var c=r.category||'기타';if(!groups[c]){groups[c]=[];gorder.push(c);}groups[c].push(r);});
      gorder.forEach(function(cat){
        groups[cat].forEach(function(row,ri){
          var isck=checkedRows[colName]&&checkedRows[colName][row.id];
          var tds='<td class="cb-col"><input type="checkbox" class="rowcb" data-id="'+row.id+'" data-col="'+colName+'" '+(isck?'checked':'')+' onchange="togRowCk(this)" onclick="event.stopPropagation()"/></td>';
          if(ri===0) tds+='<td class="cat-cell" rowspan="'+groups[cat].length+'">'+escH(cat)+'</td>';
          flds.forEach(function(k){tds+='<td>'+escH(row[k]||'')+'</td>';});
          trs+='<tr id="r-'+row.id+'"'+(isck?' class="ck"':'')+' onclick="openRowDetail(\''+row.id+'\',\''+colName+'\')">'+tds+'</tr>';
        });
      });
    } else {
      sorted.forEach(function(row){
        var isck=checkedRows[colName]&&checkedRows[colName][row.id];
        var tds='<td class="cb-col"><input type="checkbox" class="rowcb" data-id="'+row.id+'" data-col="'+colName+'" '+(isck?'checked':'')+' onchange="togRowCk(this)" onclick="event.stopPropagation()"/></td>';
        flds.forEach(function(k){tds+='<td>'+escH(row[k]||'')+'</td>';});
        trs+='<tr id="r-'+row.id+'"'+(isck?' class="ck"':'')+' onclick="openRowDetail(\''+row.id+'\',\''+colName+'\')">'+tds+'</tr>';
      });
    }
  } else {
    trs='<tr><td colspan="'+(cols.length+1)+'" class="estate">등록된 거래처가 없습니다</td></tr>';
  }

  return '<div class="ph"><div class="ph-l"><div class="ptag">'+tag+'</div><div class="ptitle">'+label+' 거래처</div></div>'
    +'<div class="ph-r"><button class="btn pri" onclick="openAddRow(\''+colName+'\')">+ 추가</button>'
    +'<button class="btn dng" onclick="delChecked(\''+colName+'\')">삭제</button>'
    +'<button class="btn" onclick="exportExcel(\''+colName+'\')">⬇ 내보내기</button>'
    +'<button class="btn" onclick="toggleUp(\''+colName+'\')">⬆ 엑셀</button></div></div>'
    +upSec(colName,(isProd?'컬럼: 종류 / 거래처명 / 연락처 / 주소 / 사용제품 / 비고':'컬럼: 거래처명 / 연락처 / 주소 / 사용제품 / 비고'))
    +'<div id="selbar-'+colName+'" class="selbar"><span class="selcnt" id="selcnt-'+colName+'">0개 선택됨</span>'
      +'<button class="btn dng" onclick="delChecked(\''+colName+'\')">선택 삭제</button>'
      +'<button class="btn" onclick="clearRowCks(\''+colName+'\')">선택 해제</button></div>'
    +'<div class="twrap"><table><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table></div>'
    +modalAddRow(colName)+modalRowDetail(colName);
}

// ── SORT ──
function sortTable(col,idx){
  if(sortState.col===idx) sortState.dir*=-1;
  else{sortState.col=idx;sortState.dir=1;}
  render();
}

// ── ROW DETAIL MODAL ──
function openRowDetail(id,col){
  var arr=col==='production'?allProd:allPkg;
  var row=arr.find(function(r){return r.id===id;});
  if(!row)return;
  _hlId=id;hlCol=col;
  var el=document.getElementById('rd-modal-'+col);
  if(!el)return;
  el.style.display='flex';
  document.getElementById('rd-title-'+col).textContent=row.name||'';
  var flds=col==='production'
    ?[{l:'종류',v:row.category},{l:'거래처명',v:row.name},{l:'연락처',v:row.contact},
      {l:'주소',v:row.address},{l:'사용제품',v:row.products},{l:'비고',v:row.note}]
    :[{l:'거래처명',v:row.name},{l:'연락처',v:row.contact},
      {l:'주소',v:row.address},{l:'사용제품',v:row.products},{l:'비고',v:row.note}];
  document.getElementById('rd-fields-'+col).innerHTML=flds.map(function(f){
    return '<div class="dr"><div class="dlb">'+f.l+'</div><div class="dvl">'+escH(f.v||'—')+'</div></div>';
  }).join('');
  document.getElementById('rd-edit-'+col).onclick=function(){closeM('rd-modal-'+col);openEditRow(id,col);};
  document.getElementById('rd-del-'+col).onclick=function(){
    if(!confirm('이 거래처를 삭제하시겠습니까?'))return;
    delIt(col==='production'?'production':'package',id).then(function(){
      if(col==='production')allProd=allProd.filter(function(r){return r.id!==id;});
      else allPkg=allPkg.filter(function(r){return r.id!==id;});
      closeM('rd-modal-'+col);render();toast('삭제되었습니다');
    }).catch(function(e){toast('삭제 실패: '+(e.message||e));});
  };
}
function modalRowDetail(col){
  return '<div id="rd-modal-'+col+'" class="overlay" style="display:none" onclick="if(event.target===this)closeM(\'rd-modal-'+col+'\')">'
    +'<div class="modal" style="max-width:420px">'
      +'<div class="mhd"><h3 id="rd-title-'+col+'"></h3><button class="mcls" onclick="closeM(\'rd-modal-'+col+'\')">Close ✕</button></div>'
      +'<div class="mbdy"><div id="rd-fields-'+col+'"></div>'
        +'<div class="fa"><button class="btn" id="rd-edit-'+col+'">✏ 편집</button><button class="btn dng" id="rd-del-'+col+'">삭제</button></div>'
      +'</div>'
    +'</div></div>';
}

  });

    +upSec('idpw','컬럼: 업체명 / ID / PW / 사이트주소')
    +'<div id="selbar-idpw" class="selbar"><span class="selcnt" id="selcnt-idpw">0개 선택됨</span>'

function togPwVis(btn){

function togIdpwSel(id){
  _hlId=id;hlCol='idpw';

function openDetail(id){
  var item=allBuja.find(function(i){return i.id===id;});if(!item)return;
  var el=document.getElementById('detModal');if(!el)return;
  el.style.display='flex';

  var flds=[{l:'별칭',v:item.alias},{l:'판매처',v:item.seller},{l:'판매처 정보',v:item.sellerInfo},
    {l:'가격',v:item.price},{l:'주문단위',v:item.orderUnit},{l:'비고',v:item.note}];
  document.getElementById('detFields').innerHTML=flds.map(function(f){
    return '<div class="dr"><div class="dlb">'+f.l+'</div><div class="dvl">'+escH(f.v||'—')+'</div></div>';
  }).join('');
  document.getElementById('detEditBtn').onclick=function(){closeM('detModal');openEditProd(id);};
  document.getElementById('detDelBtn').onclick=function(){
    if(!confirm('이 제품을 삭제하시겠습니까?'))return;
    delIt('buja',id).then(function(){

// ── UPLOAD ──
function upSec(type,note){
  return '<div class="upsec" id="up-'+type+'">'
    +'<h4>Excel Upload — 새 항목만 추가됩니다</h4>'
    +'<div class="uprow"><input type="file" accept=".xlsx,.xls" onchange="handleExcel(this,\''+type+'\')"/></div>'
    +'<div class="upnote">'+note+'</div></div>';
}
function toggleUp(type){var el=document.getElementById('up-'+type);if(el)el.classList.toggle('open');}
function handleExcel(input,type){
  var file=input.files[0];if(!file)return;
  toast('엑셀 처리 중...');
  if(!window.XLSX){
    var s=document.createElement('script');
    s.src='https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=function(){procExcel(file,type,input);};
    s.onerror=function(){
      var s2=document.createElement('script');
      s2.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s2.onload=function(){procExcel(file,type,input);};
      s2.onerror=function(){toast('라이브러리 로드 실패');};
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  } else {procExcel(file,type,input);}
}
function procExcel(file,type,input){
  var reader=new FileReader();
  reader.onload=function(e){
    var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    var promises=[],added=0;
    function s2j(ws){
      var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!raw||!raw.length)return[];
      var hi=0;
      for(var i=0;i<raw.length;i++){if(raw[i][0]&&String(raw[i][0]).trim()){hi=i;break;}}
      var hdrs=raw[hi].map(function(h){return String(h||'').trim();});
      var res=[];
      for(var r=hi+1;r<raw.length;r++){
        var row=raw[r];
        if(!row.some(function(v){return v!=='';}))continue;
        var obj={};hdrs.forEach(function(h,ci){obj[h]=String(row[ci]||'').trim();});
        res.push(obj);
      }
      return res;
    }
    if(type==='buja'||type==='bs'){
      var ex={};allBuja.forEach(function(i){ex[i.season]=true;});
      wb.SheetNames.forEach(function(sn){
        if(ex[sn])return;
        s2j(wb.Sheets[sn]).forEach(function(row){
          if(!row['제품명'])return;
          var item={season:sn,name:row['제품명'],alias:row['별칭']||'',seller:row['판매처']||'',
            sellerInfo:row['판매처정보']||'',price:row['가격']||'',orderUnit:row['주문단위']||'',
            note:row['비고']||'',imageUrl:''};
          promises.push(addIt('buja',item).then(function(id){allBuja.push(Object.assign({id:id},item));added++;}));
        });
      });
    } else if(type==='idpw'){
      var ex2={};allIdpw.forEach(function(r){ex2[r.company]=true;});
      wb.SheetNames.forEach(function(sn){
        s2j(wb.Sheets[sn]).forEach(function(row){
          var c=row['업체명']||'';if(!c||ex2[c])return;ex2[c]=true;
          var item={company:c,userid:row['ID']||'',password:row['PW']||'',url:row['사이트주소']||''};
          promises.push(addIt('idpw',item).then(function(id){allIdpw.push(Object.assign({id:id},item));added++;}));
        });
      });
    } else {
      var dbCol=type==='production'?'production':'package';
      var arr=type==='production'?allProd:allPkg;
      var ex3={};arr.forEach(function(r){ex3[r.name]=true;});
      wb.SheetNames.forEach(function(sn){
        s2j(wb.Sheets[sn]).forEach(function(row){
          var n=row['거래처명']||'';
          if(!n||n.startsWith('[')||ex3[n])return;ex3[n]=true;
          var item={category:row['종류']||'',name:n,contact:row['연락처']||'',
            address:row['주소']||'',products:row['사용제품']||'',note:row['비고']||''};
          promises.push(addIt(dbCol,item).then(function(id){
            if(type==='production')allProd.push(Object.assign({id:id},item));
            else allPkg.push(Object.assign({id:id},item));
            added++;
          }));
        });
      });
    }
    Promise.all(promises)
      .then(function(){render();toast(added+'개 추가됨');try{if(input)input.value='';}catch(e){}})
      .catch(function(e){toast('업로드 실패: '+(e.message||e));});
  };
  reader.onerror=function(){toast('파일 읽기 실패');};
  reader.readAsArrayBuffer(file);
}

// ── EXPORT ──
function exportExcel(type){
  if(!window.XLSX){toast('라이브러리 로딩 중...');setTimeout(function(){exportExcel(type);},800);return;}
  var wb=XLSX.utils.book_new();
  if(type==='buja'){
    var seasons={};
    allBuja.filter(function(i){return !i._placeholder&&i.name;}).forEach(function(i){
      var s=i.season||'미분류';if(!seasons[s])seasons[s]=[];seasons[s].push(i);
    });
    Object.keys(seasons).forEach(function(s){
      var rows=[['제품명','별칭','판매처','판매처정보','가격','주문단위','비고']];
      seasons[s].forEach(function(i){rows.push([i.name,i.alias,i.seller,i.sellerInfo,i.price,i.orderUnit,i.note]);});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),s.substring(0,31));
    });
    XLSX.writeFile(wb,'RSSC_부자재_'+today()+'.xlsx');
  } else if(type==='production'){
    var rows=[['종류','거래처명','연락처','주소','사용제품','비고']];
    allProd.forEach(function(r){rows.push([r.category||'',r.name,r.contact,r.address,r.products,r.note]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'생산거래처');
    XLSX.writeFile(wb,'RSSC_생산_'+today()+'.xlsx');
  } else if(type==='package'){
    var rows=[['거래처명','연락처','주소','사용제품','비고']];
    allPkg.forEach(function(r){rows.push([r.name,r.contact,r.address,r.products,r.note]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'패키지거래처');
    XLSX.writeFile(wb,'RSSC_패키지_'+today()+'.xlsx');
  } else if(type==='idpw'){
    var rows=[['업체명','ID','PW','사이트주소']];
    allIdpw.forEach(function(r){rows.push([r.company,r.userid,r.password,r.url]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'ID_PW');
    XLSX.writeFile(wb,'RSSC_IDPW_'+today()+'.xlsx');
  }
  toast('내보내기 완료');
}
function today(){var d=new Date();return d.getFullYear()+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+(d.getDate()<10?'0':'')+d.getDate();}

// ── SEARCH (expanded: contact, address, products) ──
function doSearch(){
  var q=document.getElementById('sinput').value.trim().toLowerCase();
  if(!q){closeSpop();return;}
  var results=[];
  function hi(s){return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="srhi">$1</span>');}
  allBuja.filter(function(i){return !i._placeholder&&i.name;}).forEach(function(i){
    var fields=[i.name,i.alias,i.seller].join(' ').toLowerCase();
    if(fields.indexOf(q)>=0)
      results.push({type:'부자재',name:hi(i.name||''),sub:hi(i.season||'')+(i.alias?' · '+hi(i.alias):''),pg:'buja-season',seas:i.season,id:i.id});
  });
  allProd.forEach(function(r){
    var fields=[r.name,r.contact,r.address,r.products,r.category].join(' ').toLowerCase();
    if(fields.indexOf(q)>=0)
      results.push({type:'생산',name:hi(r.name||''),sub:hi(r.address||'')+(r.contact?' · '+hi(r.contact):''),pg:'prod',id:r.id});
  });
  allPkg.forEach(function(r){
    var fields=[r.name,r.contact,r.address,r.products].join(' ').toLowerCase();
    if(fields.indexOf(q)>=0)
      results.push({type:'패키지',name:hi(r.name||''),sub:hi(r.address||'')+(r.contact?' · '+hi(r.contact):''),pg:'pkg',id:r.id});
  });
  allIdpw.forEach(function(r){
    if((r.company||'').toLowerCase().indexOf(q)>=0)
      results.push({type:'ID/PW',name:hi(r.company||''),sub:hi(r.url||''),pg:'idpw',id:r.id});
  });

  if(results.length===1){navResult(results[0]);closeSpop();return;}
  var popup=document.getElementById('spop');
  popup.style.display='block';
  window._sr=results;
  if(!results.length){popup.innerHTML='<div class="sphd"><span>검색 결과</span><button onclick="closeSpop()">✕</button></div><div class="sri"><div class="srs">검색 결과가 없습니다</div></div>';return;}
  var html='<div class="sphd"><span>검색 결과 '+results.length+'건</span><button onclick="closeSpop()">✕</button></div>';
  results.forEach(function(r,i){
    html+='<div class="sri" onclick="navResult('+i+')">'
      +'<div class="srt">'+r.type+'</div><div class="srn">'+r.name+'</div><div class="srs">'+r.sub+'</div></div>';
  });
  popup.innerHTML=html;
}
function navResult(r){
  if(typeof r==='number')r=window._sr[r];
  if(!r)return;closeSpop();
  if(r.pg==='buja-season'){season=r.seas;go('buja-season');setTimeout(function(){if(r.id)openDetail(r.id);},100);}
  else if(r.pg==='prod'){go('prod');setTimeout(function(){if(r.id)openRowDetail(r.id,'production');},100);}
  else if(r.pg==='pkg'){go('pkg');setTimeout(function(){if(r.id)openRowDetail(r.id,'package');},100);}
  else if(r.pg==='idpw'){idpwUnlocked=true;go('idpw');setTimeout(function(){if(r.id)togIdpwSel(r.id);},100);}
}
function closeSpop(){document.getElementById('spop').style.display='none';}

// ── UTILS ──
function closeM(id){var el=document.getElementById(id);if(el)el.style.display='none';}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,dur){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},dur||2500);
}
document.addEventListener('click',function(e){
  var pop=document.getElementById('spop'),bar=document.getElementById('sbar');
  if(pop.style.display!=='none'&&!pop.contains(e.target)&&!bar.contains(e.target))closeSpop();
  var mm=document.getElementById('mmenu'),mt=document.getElementById('mbt');
  if(mm&&mt&&!mm.contains(e.target)&&!mt.contains(e.target))mm.classList.remove('open');
});
</script>
